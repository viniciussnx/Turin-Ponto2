services:
  postgres:
    image: postgres:16-alpine
    container_name: turin-ponto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: turin
      POSTGRES_PASSWORD: turin_dev
      POSTGRES_DB: turin_ponto
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turin -d turin_ponto"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: turin-ponto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: turin-ponto-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: turin
      MINIO_ROOT_PASSWORD: turin_dev_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
